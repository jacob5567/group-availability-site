<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="When Are We Free">
  <title>When Are We Free</title>
  <!-- Three schedules, ghosted, with the column where all three agree burned in. -->
  <rect width="32" height="32" rx="7" fill="#2f6f4e"/>
  <g fill="#fbfaf8">
    <rect x="4"  y="6.5"  width="18" height="5" rx="2.5" fill-opacity="0.42"/>
    <rect x="10" y="13.5" width="17" height="5" rx="2.5" fill-opacity="0.42"/>
    <rect x="6"  y="20.5" width="15" height="5" rx="2.5" fill-opacity="0.42"/>
    <rect x="10" y="6.5"  width="11" height="5"/>
    <rect x="10" y="13.5" width="11" height="5"/>
    <rect x="10" y="20.5" width="11" height="5"/>
  </g>
</svg>
